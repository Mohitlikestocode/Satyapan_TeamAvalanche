# Run from the repo root:  docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Copy .env.example to .env first and fill it in. Nothing secret is ever committed.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    env_file: ../.env
    environment:
      SATYAPAN_HOME: /data
    volumes:
      - satyapan_data:/data
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, for example 203.0.113.7.sslip.io or your domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Telegram bot: same image, second process. Start it with: docker compose --profile bot up -d
  bot:
    profiles: ["bot"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "satyapan.bots.telegram_bot"]
    env_file: ../.env
    environment:
      SATYAPAN_HOME: /data
    volumes:
      - satyapan_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  satyapan_data:
  caddy_data:
  caddy_config:
