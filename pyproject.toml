[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satyapan"
version = "0.1.0"
description = "Satyapan: forward-to-verify for deepfake financial-fraud media (Team Avalanche, RAKSHAM Track 3)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "httpx>=0.27",
  "cryptography>=42",
  "argon2-cffi>=23",
  "pyotp>=2.9",
  "numpy>=1.26",
  "pillow>=10.3",
  "imagehash>=4.3",
  "rapidfuzz>=3.9",
  "PyYAML>=6.0",
  "zxing-cpp>=2.2",        # QR decode, extract/qr.py
  "pypdf>=4.0",            # PDF text and metadata, layers/l2_forensics/pdf.py
  "reportlab>=4.2",
  "segno>=1.6",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8", "ruff>=0.5", "segno>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satyapan = ["reasons/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: needs model assets", "assets: needs downloaded assets"]

[tool.ruff]
line-length = 110
target-version = "py311"
